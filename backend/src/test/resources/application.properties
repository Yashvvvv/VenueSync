# Test Configuration
spring.application.name=venuesync-test

# H2 In-Memory Database for Tests
# NON_KEYWORDS=VALUE: H2 2.x made VALUE a reserved word, so the QrCode entity's
# `value` column made `create table qr_codes` fail. Hibernate logs that DDL error
# and carries on, so the table was simply absent while every test still passed -
# the unit tests mock the repository. Postgres does not reserve VALUE, so prod
# was never affected and no migration is needed.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable OAuth2 for tests (will be mocked).
# Never fetched: Spring resolves the issuer lazily (NimbusJwtDecoder
# .withIssuerLocation), so an unreachable URL is fine as long as no test
# actually decodes a token. `audiences` is deliberately NOT set here - it would
# add a validator with nothing to validate against.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/test

# Auth0 Management API - dummy values so Auth0RoleService can be constructed
# during context loading. No network call happens unless assignRoleToUser runs.
# Auth0RoleService reads these environment-variable names directly, so they are
# declared with those names here. Only AUTH0_DOMAIN is required; the two M2M
# values default to empty and the service refuses role upgrades without them.
# No network call happens unless assignRoleToUser runs.
AUTH0_DOMAIN=test.example.auth0.com

# Timezone
app.timezone=UTC

# Disable scheduling in tests
spring.task.scheduling.enabled=false

