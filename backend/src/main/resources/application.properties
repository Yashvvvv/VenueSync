# ============================================================================
# CONFIG MAP (same header in all 5 config files, so any one orients you):
#   .env.example                -> template for local Docker Compose overrides
#   docker-compose.yml          -> reads .env; runs db/adminer/keycloak always,
#                                   + this app's own container if --profile full-stack
#   Dockerfile                  -> builds the image docker-compose AND Render run
#   application.properties      -> YOU ARE HERE: base config + a `default`-profile
#                                   section, active whenever SPRING_PROFILES_ACTIVE
#                                   is unset. Used by `mvnw spring-boot:run`.
#                                   Legacy Keycloak config sits at the very bottom.
#   application-prod.properties -> `prod` profile overrides. Used by Render and by
#                                   docker-compose's --profile full-stack backend.
# Fallback policy: base/dev values below default to localhost so zero setup is
# needed for `mvnw`. Nothing security/data-sensitive gets a fallback in the
# prod file - see application-prod.properties.
# ============================================================================
spring.application.name=venuesync

# NOTE: spring.profiles.active is deliberately NOT set here.
# Spring Boot rejects it in any file that also contains profile-activated
# documents (the `#---` block at the bottom), failing at startup with
# InactiveConfigDataAccessException before a single bean is created. The local
# defaults live in that block, activated on the `default` profile - which is
# what Spring uses when no profile is set - so no explicit activation is needed.
# Set SPRING_PROFILES_ACTIVE=prod in the environment (Render does) to switch.

# Application Timezone - IMPORTANT for wall-clock time approach
# Set this to match the timezone where events are happening
# This ensures LocalDateTime.now() returns the correct local time
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Database Connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:changemeinprod!}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Auth0 / OAuth2 resource server
# Trailing slash is required: Auth0's discovery document reports its issuer as
# "https://<domain>/", and Spring compares the token's `iss` to this string
# exactly. Verify with https://${AUTH0_DOMAIN}/.well-known/openid-configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://${AUTH0_DOMAIN}/}
# Rejects tokens minted for a different API in the same tenant.
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}

# Auth0 Management API - used only by the ATTENDEE -> ORGANIZER role bridge.
# Deliberately NOT mapped to auth0.* keys here: Auth0RoleService reads
# AUTH0_DOMAIN / AUTH0_M2M_CLIENT_ID / AUTH0_M2M_CLIENT_SECRET straight from the
# environment. Mapping them through properties failed to reach the Environment
# in the container (see the javadoc on that constructor for the evidence), and
# it would have failed the same way on Render. The variables are still listed in
# .env.example and must be set in Render.

# Unlike the Keycloak block below there is no localhost IDP to fall back to, so
# these AUTH0_* vars must be real even in dev. Spring does NOT read backend/.env
# (no dotenv dependency) - export them, or set them in your IDE run config.
# Startup fails fast on an unresolved placeholder.


# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Jackson serialization - serialize LocalDateTime without timezone conversion
# This treats all times as "wall clock" times (event at 2pm shows as 2pm everywhere)
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Request logging
logging.level.org.springframework.web=INFO
logging.level.com.fullstack.venuesync=INFO

# Server
server.port=${PORT:8080}

# ===========================================================================
# Local-development overrides — active whenever no profile is set.
# `default` is the profile Spring uses when SPRING_PROFILES_ACTIVE is absent,
# so this block applies to `mvnw spring-boot:run` and switches itself off the
# moment Render sets SPRING_PROFILES_ACTIVE=prod.
# Only what is genuinely dev-specific: verbose SQL + logging. Everything else
# (datasource, issuer-uri, CORS, ...) already defaults correctly above, so it
# is not repeated here. Never add spring.profiles.active to this file at all —
# see the note beside spring.application.name for why it fails at startup.
# ===========================================================================
#---
spring.config.activate.on-profile=default
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.web=DEBUG
logging.level.com.fullstack.venuesync=DEBUG
logging.level.org.springframework.security=DEBUG

# ##### EVERYTHING BELOW IS LEGACY KEYCLOAK - COMMENTED, NOT DELETED #####
# ---------------------------------------------------------------------------
# LEGACY: self-hosted Keycloak (kept commented, not deleted - see keycloak/README.md)
#
# Why it was replaced: Render's free tier allows 750 instance-hours/month. The
# backend and a Keycloak container both running 24/7 consumed it in ~15 days
# (2 services x 24h = 48h/day). Moving to a hosted IDP removed the second
# always-on service. Keycloak itself was never the problem - the hosting bill was.
#
# What changed, protocol-wise: nothing. Both are OAuth2/OIDC servers issuing
# JWTs; this app is a resource server either way and only ever validates. The
# only real difference is the shape of the roles claim - Keycloak nests them
# under realm_access.roles, Auth0 emits a flat namespaced array. See
# JwtAuthenticationConverter for that half.
#
# To run against Keycloak again: `docker-compose up -d` still starts the container
# (it has no profile gate), then swap the issuer/audiences lines above for the one
# below, and uncomment KeycloakAdminConfig, KeycloakAdminServiceImpl and the
# keycloak-admin-client dependency in pom.xml.
#
# # Keycloak / OAuth2
# spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/event-ticket-platform}
#
# # Keycloak Admin Client
# The ATTENDEE -> ORGANIZER role-assignment bridge. Authenticated as a human
# admin user (username/password against the master realm), which is why it needed
# five properties; the Auth0 equivalent uses two client-credential values.
#
# keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:9090}
# keycloak.admin.realm=${KEYCLOAK_REALM:event-ticket-platform}
# keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
# keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
# keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
# ---------------------------------------------------------------------------
