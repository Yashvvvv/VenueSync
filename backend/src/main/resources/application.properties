# ============================================================================
# CONFIG MAP (same header in all 5 config files, so any one orients you):
#   .env.example                -> template for local Docker Compose overrides
#   docker-compose.yml          -> reads .env; runs db/adminer/keycloak always,
#                                   + this app's own container if --profile full-stack
#   Dockerfile                  -> builds the image docker-compose AND Render run
#   application.properties      -> YOU ARE HERE: base config + `dev` section below.
#                                   Active by default. Used by `mvnw spring-boot:run`.
#   application-prod.properties -> `prod` profile overrides. Used by Render and by
#                                   docker-compose's --profile full-stack backend.
# Fallback policy: base/dev values below default to localhost so zero setup is
# needed for `mvnw`. Nothing security/data-sensitive gets a fallback in the
# prod file - see application-prod.properties.
# ============================================================================
spring.application.name=venuesync

# Active profile (override via SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Timezone - IMPORTANT for wall-clock time approach
# Set this to match the timezone where events are happening
# This ensures LocalDateTime.now() returns the correct local time
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Database Connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:changemeinprod!}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak / OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/event-ticket-platform}

# Keycloak Admin Client
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:9090}
keycloak.admin.realm=${KEYCLOAK_REALM:event-ticket-platform}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Jackson serialization - serialize LocalDateTime without timezone conversion
# This treats all times as "wall clock" times (event at 2pm shows as 2pm everywhere)
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Request logging
logging.level.org.springframework.web=INFO
logging.level.com.fullstack.venuesync=INFO

# Server
server.port=${PORT:8080}

# ===========================================================================
# dev profile overrides — active by default (see spring.profiles.active above)
# Only what's genuinely dev-specific: verbose SQL + logging. Everything else
# (datasource, issuer-uri, CORS, ...) already defaults correctly above, so it
# is not repeated here. Do not add spring.profiles.active below this line —
# Spring Boot forbids setting it inside a profile-specific document.
# ===========================================================================
#---
spring.config.activate.on-profile=dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.web=DEBUG
logging.level.com.fullstack.venuesync=DEBUG
logging.level.org.springframework.security=DEBUG
