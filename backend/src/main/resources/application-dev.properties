# Development Profile
# Only overrides that genuinely differ from application.properties' defaults
# live here (verbose SQL + logging). Database URL, issuer-uri, CORS, etc.
# already default correctly for local dev in application.properties — do not
# re-duplicate them here.

# JPA - verbose SQL for local debugging (silent by default in application.properties)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging - verbose for development
logging.level.org.springframework.web=DEBUG
logging.level.com.fullstack.venuesync=DEBUG
logging.level.org.springframework.security=DEBUG
