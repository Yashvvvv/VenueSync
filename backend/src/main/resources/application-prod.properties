# ============================================================================
# CONFIG MAP (same header in all 5 config files, so any one orients you):
#   .env.example              -> template for local Docker Compose overrides
#   docker-compose.yml        -> reads .env; runs db/adminer/keycloak always,
#                                 + this app's own container if --profile full-stack
#   Dockerfile                -> builds the image docker-compose AND Render run
#   application.properties    -> base config + `dev` section, active by default,
#                                 used by `mvnw spring-boot:run`
#   application-prod.properties -> YOU ARE HERE: `prod` profile overrides, used
#                                 by Render (real deploy) and by docker-compose's
#                                 --profile full-stack backend (local sanity check)
# Fallback policy: every security/data-sensitive value below has NO fallback -
# it must be supplied as a real env var (Render dashboard, or .env for the
# local full-stack profile) or the app refuses to start. Only genuinely safe-
# either-way values (pool size, ddl-auto - see below) get a documented default.
# ============================================================================
# Production Profile

# Database - provided via environment variables
# Render provides jdbcConnectionString (jdbc:postgresql://...) with SSL
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
# Force SSL for Render PostgreSQL
spring.datasource.hikari.data-source-properties.sslmode=require

# JPA - schema management
# There is no migration tool (Flyway/Liquibase) in this project yet, so
# Hibernate itself creates/alters the schema on boot. `update` is a
# deliberate choice for now, not an accidental default - it's additive
# (adds columns/tables, doesn't drop them), but it IS an unreviewed,
# unaudited schema change running automatically on every deploy.
# Set JPA_DDL_AUTO=validate on Render (dashboard env var) once a real
# migration tool manages schema changes instead - validate refuses to
# start if entities don't match the DB, so nothing will apply changes
# for you at that point; they need to be applied by a migration first.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:${SPRING_JPA_HIBERNATE_DDL_AUTO:update}}
spring.jpa.show-sql=false

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# CORS - restrict to deployed frontend domain
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging - production level
logging.level.org.springframework.web=WARN
logging.level.com.fullstack.venuesync=INFO
logging.level.org.springframework.security=WARN

# Actuator - limit exposure in prod
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
