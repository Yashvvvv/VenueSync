# ============================================================================
# CONFIG MAP (same header in all 5 config files, so any one orients you):
#   .env.example                -> template you copy to .env to feed THIS file
#   docker-compose.yml          -> YOU ARE HERE: reads .env (or the ${VAR:-default}
#                                   fallbacks below if no .env exists). Default
#                                   `docker-compose up -d` = db+adminer+keycloak
#                                   only. `--profile full-stack` also builds and
#                                   runs the backend service below, passing it
#                                   the env vars it needs as container env.
#   Dockerfile                  -> what the backend service (and Render) builds from
#   application.properties      -> base+dev config the backend reads when YOU run
#                                   it directly with `mvnw` instead of this file
#   application-prod.properties -> prod config the backend reads when it runs
#                                   AS a container here (--profile full-stack)
#                                   or on Render
# ============================================================================
services:
  # Our PostgreSQL database
  db:
    # Using the latest PostgreSQL image
    image: postgres:latest
    # map container 5432 to host 5433 to avoid collision with any local Postgres on the host
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changemeinprod!}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      PGTZ: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database management interface
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "${ADMINER_HOST_PORT:-8888}:8080"

  #Keycloak Identity and Access Management
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "${KEYCLOAK_HOST_PORT:-9090}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:9090}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-true}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
    volumes:
      - keycloak-data:/opt/keycloak/data
    command:
      - start
      - --db=dev-file
      - --http-enabled=true
      - --proxy-headers=${KC_PROXY_HEADERS:-xforwarded}
      - --hostname=${KEYCLOAK_PUBLIC_BASE_URL:-http://localhost:9090}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # VenueSync Backend API — containerized backend, OPT-IN only.
  # `docker-compose up -d` (no flags) starts db + adminer + keycloak ONLY —
  # that's the default local dev loop: run the app yourself with
  # `mvnw spring-boot:run` (dev profile, defaults in application.properties,
  # no .env required) against these containers.
  # This service is for running the backend itself in a container too
  # (prod profile, config from .env) — start it explicitly with:
  #   docker-compose --profile full-stack up -d
  backend:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_HOST_PORT:-80}:8080"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/postgres}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-changemeinprod!}
      # The local `db` container speaks no SSL; Render's Postgres requires it.
      # Defaults to `require` so only an explicit opt-out in .env relaxes it.
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
      # Auth0. No `:-default` on these on purpose: a wrong-but-present issuer
      # fails as a silent 401 on every request, which is far harder to debug
      # than a container that refuses to start. Values come from .env.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_M2M_CLIENT_ID: ${AUTH0_M2M_CLIENT_ID}
      AUTH0_M2M_CLIENT_SECRET: ${AUTH0_M2M_CLIENT_SECRET}
      # LEGACY: Keycloak issuer, kept commented (see keycloak/README.md).
      # KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:9090/realms/event-ticket-platform}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://venuesync.pages.dev,https://aeea1436.venuesync.pages.dev}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}

volumes:
  keycloak-data:
    driver: local
  postgres-data:
    driver: local
